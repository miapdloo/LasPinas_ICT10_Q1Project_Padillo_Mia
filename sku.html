
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU generator - Project</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      background-image: url(ictimg.jpg);
    }

    header {
      background: rgba(230, 188, 214, 0.92);
      color: #000000;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4f3331;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Trebuchet MS', sans-serif;
    }

    button:hover {
      background: #6e4946;
    }

    .output {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }

    nav {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1 style="font-family: Trebuchet MS;">SKU Generator</h1>
  </header>

  <div class="container">

    <label for="category" style="font-family: Trebuchet MS;">Product Category:</label>

    <select id="category"
            style="width: 100%; padding: 8px; margin-bottom: 15px;">
      <option value="Category" style="font-family: Trebuchet MS;">Choose category</option>
      <option value="Mint" style="font-family: Trebuchet MS;">Mentos mints</option>
      <option value="Gum" style="font-family: Trebuchet MS;">Mentos chewing gum</option>
    </select>

    <label for="name" style="font-family: Trebuchet MS;">Product Name:</label>

    <input
      type="text"
      id="name"
      placeholder="e.g. Mentos Peppermint Mints Tin (35g)"
      style="font-family: Trebuchet MS;"
    >

    <label for="quantity" style="font-family: Trebuchet MS;">Quantity:</label>

    <input
      type="number"
      id="quantity"
      placeholder="e.g. 67"
      style="font-family: Trebuchet MS;"
    >

    <button py-click="SKU_generator">
      Generate SKU
    </button>

    <div class="output" id="sku_output">
      <p style="font-family: Trebuchet MS;">Your SKU will appear here.</p>
    </div>

    <nav>
      <a href="index.html" style="font-family: Trebuchet MS;">Receipt Generator</a>
    </nav>
 
  </div>

  
  <script type="py" src="./main.py"></script>

</body>
</html>
